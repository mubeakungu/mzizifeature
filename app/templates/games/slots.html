{% extends "base.html" %}

{% block title %}Slots - Mzizibet Casino{% endblock %}

{% block content %}
<div class="game-container slots-game">
    <div class="game-header">
        <h1>{{ game.name }}</h1>
        <div class="header-stats">
            <div class="stat">
                <span class="label">Balance</span>
                <span class="value" id="balance">0.00 KES</span>
            </div>
            <div class="stat">
                <span class="label">Bet</span>
                <span class="value" id="current-bet">10.00 KES</span>
            </div>
            <div class="stat">
                <span class="label">Win</span>
                <span class="value" id="last-win">0.00 KES</span>
            </div>
        </div>
    </div>

    <div class="game-board">
        <!-- Slot Machine Display -->
        <div class="slot-machine">
            <div class="reels-container">
                <div class="reel" id="reel-0">
                    <div class="reel-symbols">
                        <div class="symbol">🍒</div>
                        <div class="symbol">🍌</div>
                        <div class="symbol">🍊</div>
                        <div class="symbol">🍉</div>
                        <div class="symbol">⭐</div>
                        <div class="symbol">💎</div>
                        <div class="symbol">🔔</div>
                        <div class="symbol">🏆</div>
                        <div class="symbol">7️⃣</div>
                        <div class="symbol">👑</div>
                    </div>
                </div>
                <div class="reel" id="reel-1">
                    <div class="reel-symbols">
                        <div class="symbol">🍒</div>
                        <div class="symbol">🍌</div>
                        <div class="symbol">🍊</div>
                        <div class="symbol">🍉</div>
                        <div class="symbol">⭐</div>
                        <div class="symbol">💎</div>
                        <div class="symbol">🔔</div>
                        <div class="symbol">🏆</div>
                        <div class="symbol">7️⃣</div>
                        <div class="symbol">👑</div>
                    </div>
                </div>
                <div class="reel" id="reel-2">
                    <div class="reel-symbols">
                        <div class="symbol">🍒</div>
                        <div class="symbol">🍌</div>
                        <div class="symbol">🍊</div>
                        <div class="symbol">🍉</div>
                        <div class="symbol">⭐</div>
                        <div class="symbol">💎</div>
                        <div class="symbol">🔔</div>
                        <div class="symbol">🏆</div>
                        <div class="symbol">7️⃣</div>
                        <div class="symbol">👑</div>
                    </div>
                </div>
                <div class="reel" id="reel-3">
                    <div class="reel-symbols">
                        <div class="symbol">🍒</div>
                        <div class="symbol">🍌</div>
                        <div class="symbol">🍊</div>
                        <div class="symbol">🍉</div>
                        <div class="symbol">⭐</div>
                        <div class="symbol">💎</div>
                        <div class="symbol">🔔</div>
                        <div class="symbol">🏆</div>
                        <div class="symbol">7️⃣</div>
                        <div class="symbol">👑</div>
                    </div>
                </div>
                <div class="reel" id="reel-4">
                    <div class="reel-symbols">
                        <div class="symbol">🍒</div>
                        <div class="symbol">🍌</div>
                        <div class="symbol">🍊</div>
                        <div class="symbol">🍉</div>
                        <div class="symbol">⭐</div>
                        <div class="symbol">💎</div>
                        <div class="symbol">🔔</div>
                        <div class="symbol">🏆</div>
                        <div class="symbol">7️⃣</div>
                        <div class="symbol">👑</div>
                    </div>
                </div>
            </div>
            <div class="payline"></div>
        </div>

        <!-- Controls -->
        <div class="game-controls">
            <div class="bet-control">
                <label>Bet Amount (KES)</label>
                <div class="bet-buttons">
                    <button class="bet-btn" data-bet="10">10</button>
                    <button class="bet-btn" data-bet="25">25</button>
                    <button class="bet-btn" data-bet="50">50</button>
                    <button class="bet-btn" data-bet="100">100</button>
                    <button class="bet-btn" data-bet="250">250</button>
                    <button class="bet-btn" data-bet="500">500</button>
                </div>
                <div class="custom-bet">
                    <input type="number" id="custom-bet" min="1" max="5000" value="10" placeholder="Enter amount">
                    <button id="set-custom-bet">Set</button>
                </div>
            </div>

            <div class="auto-play">
                <label>Auto Spin</label>
                <select id="auto-spins">
                    <option value="0">Manual</option>
                    <option value="5">5 Spins</option>
                    <option value="10">10 Spins</option>
                    <option value="25">25 Spins</option>
                    <option value="50">50 Spins</option>
                </select>
            </div>

            <div class="action-buttons">
                <button id="spin-btn" class="btn-primary" disabled>SPIN</button>
                <button id="cashout-btn" class="btn-secondary">Cash Out</button>
            </div>
        </div>

        <!-- Message Display -->
        <div id="message" class="message-box"></div>
    </div>
</div>

<style>
.slots-game {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    background: linear-gradient(135deg, #0b1f14 0%, #123822 100%);
    border-radius: 15px;
    color: #fff;
}

.game-header {
    margin-bottom: 30px;
    text-align: center;
}

.game-header h1 {
    font-size: 2.5em;
    margin: 0 0 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    color: #ffb347;
}

.header-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    border-left: 3px solid #ffb347;
}

.stat .label {
    display: block;
    font-size: 0.9em;
    opacity: 0.7;
}

.stat .value {
    display: block;
    font-size: 1.3em;
    font-weight: bold;
    color: #ffb347;
}

.slot-machine {
    background: linear-gradient(180deg, #1a4d2e 0%, #123822 100%);
    border: 3px solid #ffb347;
    border-radius: 15px;
    padding: 30px 20px;
    margin-bottom: 30px;
    box-shadow: inset 0 0 20px rgba(255,179,71,0.2), 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
}

.reels-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.reel {
    background: #000;
    border: 2px solid #ffb347;
    border-radius: 8px;
    height: 150px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

.reel-symbols {
    display: flex;
    flex-direction: column;
    font-size: 2.5em;
    text-align: center;
    line-height: 1.5;
    transition: transform 0.3s ease;
    transform: translateY(0);
}

.symbol {
    padding: 10px 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.payline {
    height: 3px;
    background: linear-gradient(90deg, transparent, #ffb347, transparent);
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
}

.game-controls {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.bet-control,
.auto-play {
    margin-bottom: 20px;
}

.bet-control label,
.auto-play label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
    color: #ffb347;
}

.bet-buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.bet-btn {
    padding: 10px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #ffb347;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
}

.bet-btn:hover {
    background: #ffb347;
    color: #1a4d2e;
}

.bet-btn.active {
    background: #ffb347;
    color: #1a4d2e;
}

.custom-bet {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 8px;
}

.custom-bet input {
    padding: 10px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #fff;
    border-radius: 5px;
}

.custom-bet button {
    padding: 10px;
    background: #ffb347;
    border: none;
    color: #1a4d2e;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
}

.auto-play select {
    width: 100%;
    padding: 10px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #ffb347;
    border-radius: 5px;
}

.action-buttons {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
}

.btn-primary {
    padding: 15px;
    background: linear-gradient(135deg, #ffb347 0%, #f4c430 100%);
    border: none;
    color: #1a4d2e;
    font-size: 1.2em;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-primary:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(255,179,71,0.4);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-secondary {
    padding: 15px;
    background: rgba(255,255,255,0.1);
    border: 2px solid #ffb347;
    color: #ffb347;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-secondary:hover {
    background: #ffb347;
    color: #1a4d2e;
}

.message-box {
    min-height: 40px;
    padding: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    display: none;
}

.message-box.show {
    display: block;
}

.message-box.win {
    background: rgba(76, 175, 80, 0.3);
    border: 2px solid #4caf50;
    color: #4caf50;
}

.message-box.loss {
    background: rgba(244, 67, 54, 0.3);
    border: 2px solid #f44336;
    color: #f44336;
}

@media (max-width: 600px) {
    .header-stats {
        grid-template-columns: 1fr;
    }
    
    .bet-buttons {
        grid-template-columns: repeat(3, 1fr);
    }
    
    .action-buttons {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
class SlotsGame {
    constructor(gameData) {
        this.gameData = gameData;
        this.gameId = gameData.id;
        this.balance = gameData.balance;
        this.currentBet = 10;
        this.isSpinning = false;
        this.autoSpinsRemaining = 0;
        
        this.init();
    }
    
    init() {
        this.updateBalance();
        this.attachEventListeners();
        this.syncBalance();
    }
    
    attachEventListeners() {
        // Bet buttons
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                this.setBet(parseFloat(e.target.dataset.bet));
            });
        });
        
        // Custom bet
        document.getElementById('set-custom-bet').addEventListener('click', () => {
            const val = parseFloat(document.getElementById('custom-bet').value);
            if (val > 0 && val <= 5000) this.setBet(val);
        });
        
        // Spin button
        document.getElementById('spin-btn').addEventListener('click', () => {
            this.spin();
        });
        
        // Cash out
        document.getElementById('cashout-btn').addEventListener('click', () => {
            this.cashOut();
        });
        
        // Auto spin
        document.getElementById('auto-spins').addEventListener('change', (e) => {
            if (e.target.value > 0) {
                this.autoSpinsRemaining = parseInt(e.target.value);
                this.autoSpin();
            }
        });
    }
    
    setBet(amount) {
        if (amount > this.balance) {
            this.showMessage('Insufficient balance', 'loss');
            return;
        }
        this.currentBet = amount;
        document.getElementById('current-bet').textContent = amount.toFixed(2) + ' KES';
        
        // Update active button
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.classList.remove('active');
            if (parseFloat(btn.dataset.bet) === amount) {
                btn.classList.add('active');
            }
        });
    }
    
    async spin() {
        if (this.isSpinning || this.balance < this.currentBet) {
            this.showMessage('Cannot spin right now', 'loss');
            return;
        }
        
        this.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        
        try {
            // Initialize round
            const initRes = await fetch('/api/casino/init-round', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    game_id: this.gameId,
                    stake: this.currentBet,
                    client_seed: Math.random().toString(36).substring(7)
                })
            });
            
            const initData = await initRes.json();
            if (!initRes.ok) throw new Error(initData.error);
            
            this.balance = initData.balance;
            
            // Animate reels
            await this.animateReels();
            
            // Simulate server calculation (in production, server calculates payout)
            // For now, generate random slots result
            const reels = Array(5).fill().map(() => Math.floor(Math.random() * 10));
            const payout = this.calculateWin(reels);
            
            // Settle round
            const settleRes = await fetch('/api/casino/settle-round', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    round_id: initData.round_id,
                    game_id: this.gameId,
                    payout: payout,
                    game_result: { reels }
                })
            });
            
            const settleData = await settleRes.json();
            if (!settleRes.ok) throw new Error(settleData.error);
            
            this.balance = settleData.balance;
            this.updateBalance();
            
            if (payout > this.currentBet) {
                document.getElementById('last-win').textContent = (payout - this.currentBet).toFixed(2) + ' KES';
                this.showMessage(`🎉 Win! +${(payout - this.currentBet).toFixed(2)} KES`, 'win');
            } else {
                this.showMessage('No match - try again!', 'loss');
            }
            
        } catch (error) {
            console.error(error);
            this.showMessage('Error: ' + error.message, 'loss');
        } finally {
            this.isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            
            if (this.autoSpinsRemaining > 0) {
                this.autoSpinsRemaining--;
                setTimeout(() => this.spin(), 1000);
            }
        }
    }
    
    animateReels() {
        return new Promise(resolve => {
            const duration = 2000;
            const startTime = Date.now();
            
            const animate = () => {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;
                
                document.querySelectorAll('.reel').forEach((reel, i) => {
                    const offset = Math.floor(progress * 10 * (i + 1)) % 10;
                    reel.querySelector('.reel-symbols').style.transform = 
                        `translateY(-${offset * 50}px)`;
                });
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    resolve();
                }
            };
            
            animate();
        });
    }
    
    calculateWin(reels) {
        // Simple match logic
        const matches = {
            5: 1000,  // All 5 match
            3: 100,   // 3 in a row (middle)
            0: 50,    // 5 of same symbol
        };
        
        const matchCount = new Set(reels).size;
        if (matchCount === 1) return this.currentBet * 100;  // All same
        if (reels[1] === reels[2] && reels[2] === reels[3]) return this.currentBet * 10;  // 3 middle
        
        return 0;  // Loss
    }
    
    autoSpin() {
        if (this.autoSpinsRemaining > 0 && this.balance >= this.currentBet) {
            this.spin();
        }
    }
    
    updateBalance() {
        document.getElementById('balance').textContent = this.balance.toFixed(2) + ' KES';
    }
    
    showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = 'message-box show ' + type;
        setTimeout(() => msg.classList.remove('show'), 3000);
    }
    
    async syncBalance() {
        const res = await fetch('/api/casino/get-balance');
        const data = await res.json();
        this.balance = data.balance;
        this.updateBalance();
    }
    
    cashOut() {
        // Redirect to wallet
        window.location.href = '/wallet';
    }
}

// Initialize on load
window.addEventListener('DOMContentLoaded', () => {
    const gameData = {
        id: {{ game.id }},
        balance: {{ balance }}
    };
    window.slotsGame = new SlotsGame(gameData);
});
</script>
{% endblock %}
