{% extends "base.html" %}

{% block title %}European Roulette - Mzizibet Casino{% endblock %}

{% block content %}
<div class="game-container roulette-game">
    <div class="game-header">
        <h1>🎡 European Roulette</h1>
        <div class="header-stats">
            <div class="stat">
                <span class="label">Balance</span>
                <span class="value" id="balance">0.00 KES</span>
            </div>
            <div class="stat">
                <span class="label">Total Bet</span>
                <span class="value" id="total-bet">0.00 KES</span>
            </div>
            <div class="stat">
                <span class="label">Last Win</span>
                <span class="value" id="last-win">0.00 KES</span>
            </div>
        </div>
    </div>

    <div class="game-board">
        <!-- Wheel Display -->
        <div class="wheel-container">
            <canvas id="roulette-wheel" width="400" height="400"></canvas>
            <div class="winning-number" id="winning-number">-</div>
        </div>

        <!-- Betting Table -->
        <div class="betting-table">
            <div class="table-header">Click on numbers to place bets</div>
            
            <div class="numbers-grid">
                <div class="number-row">
                    <button class="number-btn" data-number="0">0</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="1">1</button>
                    <button class="number-btn" data-number="2">2</button>
                    <button class="number-btn" data-number="3">3</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="4">4</button>
                    <button class="number-btn" data-number="5">5</button>
                    <button class="number-btn" data-number="6">6</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="7">7</button>
                    <button class="number-btn" data-number="8">8</button>
                    <button class="number-btn" data-number="9">9</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="10">10</button>
                    <button class="number-btn" data-number="11">11</button>
                    <button class="number-btn" data-number="12">12</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="13">13</button>
                    <button class="number-btn" data-number="14">14</button>
                    <button class="number-btn" data-number="15">15</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="16">16</button>
                    <button class="number-btn" data-number="17">17</button>
                    <button class="number-btn" data-number="18">18</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="19">19</button>
                    <button class="number-btn" data-number="20">20</button>
                    <button class="number-btn" data-number="21">21</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="22">22</button>
                    <button class="number-btn" data-number="23">23</button>
                    <button class="number-btn" data-number="24">24</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="25">25</button>
                    <button class="number-btn" data-number="26">26</button>
                    <button class="number-btn" data-number="27">27</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="28">28</button>
                    <button class="number-btn" data-number="29">29</button>
                    <button class="number-btn" data-number="30">30</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="31">31</button>
                    <button class="number-btn" data-number="32">32</button>
                    <button class="number-btn" data-number="33">33</button>
                </div>
                <div class="number-row">
                    <button class="number-btn" data-number="34">34</button>
                    <button class="number-btn" data-number="35">35</button>
                    <button class="number-btn" data-number="36">36</button>
                </div>
            </div>

            <div class="outside-bets">
                <div class="bet-group">
                    <button class="outside-btn red-btn" data-bet="red">RED</button>
                    <button class="outside-btn black-btn" data-bet="black">BLACK</button>
                    <button class="outside-btn" data-bet="even">EVEN</button>
                    <button class="outside-btn" data-bet="odd">ODD</button>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="game-controls">
            <div class="control-group">
                <label>Bet Amount (KES)</label>
                <div class="bet-controls">
                    <input type="number" id="bet-chip" value="10" min="1" max="5000">
                    <div class="quick-chips">
                        <button class="chip-btn" data-chip="10">10</button>
                        <button class="chip-btn" data-chip="50">50</button>
                        <button class="chip-btn" data-chip="100">100</button>
                        <button class="chip-btn" data-chip="500">500</button>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="spin-btn" class="btn-primary">SPIN WHEEL</button>
                <button id="clear-bets" class="btn-secondary">Clear Bets</button>
                <button id="cashout-btn" class="btn-secondary">Cash Out</button>
            </div>
        </div>

        <div id="message" class="message-box"></div>
    </div>
</div>

<style>
.roulette-game {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
    border-radius: 15px;
    color: #fff;
}

.game-header {
    margin-bottom: 30px;
    text-align: center;
}

.game-header h1 {
    font-size: 2.5em;
    margin: 0 0 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    color: #ffb347;
}

.header-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    border-left: 3px solid #ffb347;
}

.stat .label {
    display: block;
    font-size: 0.9em;
    opacity: 0.7;
}

.stat .value {
    display: block;
    font-size: 1.3em;
    font-weight: bold;
    color: #ffb347;
}

.wheel-container {
    background: linear-gradient(180deg, #1a4d2e 0%, #123822 100%);
    border: 3px solid #ffb347;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: center;
    box-shadow: inset 0 0 20px rgba(255,179,71,0.2);
    position: relative;
}

#roulette-wheel {
    width: 100%;
    max-width: 400px;
    height: auto;
    margin: 0 auto 15px;
    display: block;
    background: #000;
    border-radius: 10px;
}

.winning-number {
    font-size: 2em;
    font-weight: bold;
    color: #ffb347;
    min-height: 40px;
}

.betting-table {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.table-header {
    text-align: center;
    font-weight: bold;
    color: #ffb347;
    margin-bottom: 15px;
}

.numbers-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
}

.number-row {
    display: contents;
}

.number-btn {
    padding: 15px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #ffb347;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    font-size: 1em;
}

.number-btn:hover {
    background: #ffb347;
    color: #1a4d2e;
    transform: scale(1.05);
}

.number-btn.has-bet {
    background: #ffb347;
    color: #1a4d2e;
}

.number-btn .chip-display {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #d4af37;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7em;
    font-weight: bold;
}

.outside-bets {
    margin-bottom: 20px;
}

.bet-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.outside-btn {
    padding: 12px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #ffb347;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    font-size: 0.9em;
}

.outside-btn:hover {
    background: #ffb347;
    color: #1a4d2e;
}

.red-btn {
    border-color: #d4af37;
    color: #d4af37;
}

.red-btn:hover {
    background: #d4af37;
    color: #fff;
}

.black-btn {
    border-color: #333;
    color: #999;
}

.black-btn:hover {
    background: #333;
    color: #fff;
}

.game-controls {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.control-group label {
    display: block;
    font-weight: bold;
    color: #ffb347;
    margin-bottom: 10px;
}

.bet-controls {
    margin-bottom: 15px;
}

.bet-controls input {
    width: 100%;
    padding: 10px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #fff;
    border-radius: 5px;
    margin-bottom: 10px;
}

.quick-chips {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.chip-btn {
    padding: 8px;
    background: #1a4d2e;
    border: 2px solid #ffb347;
    color: #ffb347;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
}

.chip-btn:hover {
    background: #ffb347;
    color: #1a4d2e;
}

.action-buttons {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 10px;
}

.btn-primary {
    padding: 15px;
    background: linear-gradient(135deg, #ffb347 0%, #f4c430 100%);
    border: none;
    color: #1a4d2e;
    font-size: 1.2em;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-primary:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(255,179,71,0.4);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-secondary {
    padding: 15px;
    background: rgba(255,255,255,0.1);
    border: 2px solid #ffb347;
    color: #ffb347;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-secondary:hover {
    background: #ffb347;
    color: #1a4d2e;
}

.message-box {
    min-height: 40px;
    padding: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    display: none;
}

.message-box.show {
    display: block;
}

.message-box.win {
    background: rgba(76,175,80,0.3);
    border: 2px solid #4caf50;
    color: #4caf50;
}

.message-box.loss {
    background: rgba(244,67,54,0.3);
    border: 2px solid #f44336;
    color: #f44336;
}

@media (max-width: 600px) {
    .header-stats {
        grid-template-columns: 1fr;
    }
    
    .numbers-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .action-buttons {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
class RouletteGame {
    constructor(gameData) {
        this.gameData = gameData;
        this.gameId = gameData.id;
        this.balance = gameData.balance;
        this.chipValue = 10;
        this.bets = {}; // { number: amount }
        this.isSpinning = false;
        this.wheelRotation = 0;
        
        this.canvas = document.getElementById('roulette-wheel');
        this.ctx = this.canvas.getContext('2d');
        this.redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        
        this.init();
    }
    
    init() {
        this.updateBalance();
        this.drawWheel();
        this.attachEventListeners();
    }
    
    drawWheel() {
        const centerX = this.canvas.width / 2;
        const centerY = this.canvas.height / 2;
        const radius = 150;
        
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw numbers 0-36
        for (let i = 0; i <= 36; i++) {
            const angle = (i / 37) * Math.PI * 2 + this.wheelRotation;
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;
            
            const isRed = this.redNumbers.includes(i);
            this.ctx.fillStyle = i === 0 ? '#2d5a3d' : (isRed ? '#ff6b6b' : '#000');
            this.ctx.strokeStyle = '#fff';
            this.ctx.lineWidth = 2;
            
            this.ctx.beginPath();
            this.ctx.arc(x, y, 12, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.stroke();
            
            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 10px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(i.toString(), x, y);
        }
        
        // Center circle
        this.ctx.fillStyle = '#ffb347';
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
        this.ctx.fill();
    }
    
    attachEventListeners() {
        document.querySelectorAll('.number-btn').forEach(btn => {
            btn.addEventListener('click', () => this.placeBet(btn.dataset.number));
        });
        
        document.querySelectorAll('.outside-btn').forEach(btn => {
            btn.addEventListener('click', () => this.placeBet(btn.dataset.bet));
        });
        
        document.querySelectorAll('.chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                this.chipValue = parseInt(btn.dataset.chip);
                document.getElementById('bet-chip').value = this.chipValue;
            });
        });
        
        document.getElementById('bet-chip').addEventListener('change', (e) => {
            this.chipValue = Math.max(1, parseInt(e.target.value) || 10);
            document.getElementById('bet-chip').value = this.chipValue;
        });
        
        document.getElementById('spin-btn').addEventListener('click', () => this.spin());
        document.getElementById('clear-bets').addEventListener('click', () => this.clearBets());
        document.getElementById('cashout-btn').addEventListener('click', () => window.location.href = '/wallet');
    }
    
    placeBet(target) {
        const amount = this.chipValue;
        if (this.balance < amount) {
            this.showMessage('Insufficient balance', 'loss');
            return;
        }
        
        if (!this.bets[target]) {
            this.bets[target] = 0;
        }
        
        this.bets[target] += amount;
        this.balance -= amount;
        this.updateBalance();
        
        // Update visual
        const btn = document.querySelector(`[data-number="${target}"], [data-bet="${target}"]`);
        if (btn && !btn.classList.contains('has-bet')) {
            btn.classList.add('has-bet');
        }
    }
    
    clearBets() {
        let totalBet = 0;
        for (let bet in this.bets) {
            totalBet += this.bets[bet];
        }
        this.balance += totalBet;
        this.bets = {};
        
        document.querySelectorAll('.number-btn, .outside-btn').forEach(btn => {
            btn.classList.remove('has-bet');
        });
        
        this.updateBalance();
    }
    
    async spin() {
        if (this.isSpinning || Object.keys(this.bets).length === 0) {
            this.showMessage('Place your bets first', 'loss');
            return;
        }
        
        this.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        
        const totalBet = Object.values(this.bets).reduce((a, b) => a + b, 0);
        
        try {
            const initRes = await fetch('/api/casino/init-round', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    game_id: this.gameId,
                    stake: totalBet,
                    client_seed: Math.random().toString(36).substring(7)
                })
            });
            
            const initData = await initRes.json();
            this.roundId = initData.round_id;
            
            // Spin animation
            const winningNumber = Math.floor(Math.random() * 37);
            await this.animateSpin(winningNumber);
            
            // Calculate payout
            let payout = 0;
            for (let bet in this.bets) {
                if (bet === winningNumber.toString()) {
                    payout += this.bets[bet] * 36; // Straight bet pays 35:1
                } else if (bet === 'red' && this.redNumbers.includes(winningNumber)) {
                    payout += this.bets[bet] * 2; // Red/Black pays 1:1
                } else if (bet === 'black' && !this.redNumbers.includes(winningNumber) && winningNumber !== 0) {
                    payout += this.bets[bet] * 2;
                } else if (bet === 'even' && winningNumber % 2 === 0 && winningNumber !== 0) {
                    payout += this.bets[bet] * 2;
                } else if (bet === 'odd' && winningNumber % 2 === 1) {
                    payout += this.bets[bet] * 2;
                }
            }
            
            // Settle
            const settleRes = await fetch('/api/casino/settle-round', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    round_id: initData.round_id,
                    game_id: this.gameId,
                    payout: payout,
                    game_result: { winning_number: winningNumber }
                })
            });
            
            const settleData = await settleRes.json();
            this.balance = settleData.balance;
            this.updateBalance();
            
            if (payout > totalBet) {
                const profit = payout - totalBet;
                document.getElementById('last-win').textContent = profit.toFixed(2) + ' KES';
                this.showMessage(`🎉 ${winningNumber}! +${profit.toFixed(2)} KES`, 'win');
            } else {
                this.showMessage(`Number: ${winningNumber} - Try again!`, 'loss');
            }
            
            this.clearBets();
            
        } catch (error) {
            console.error(error);
            this.showMessage('Error: ' + error.message, 'loss');
        } finally {
            this.isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }
    }
    
    animateSpin(winningNumber) {
        return new Promise(resolve => {
            const spins = 5;
            const angle = (winningNumber / 37) * Math.PI * 2;
            const targetRotation = spins * Math.PI * 2 + angle;
            const duration = 3000;
            const startTime = Date.now();
            
            const animate = () => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing out
                const eased = 1 - Math.pow(1 - progress, 3);
                this.wheelRotation = targetRotation * eased;
                this.drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    document.getElementById('winning-number').textContent = winningNumber;
                    resolve();
                }
            };
            
            animate();
        });
    }
    
    updateBalance() {
        document.getElementById('balance').textContent = this.balance.toFixed(2) + ' KES';
        const total = Object.values(this.bets).reduce((a, b) => a + b, 0);
        document.getElementById('total-bet').textContent = total.toFixed(2) + ' KES';
    }
    
    showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = 'message-box show ' + type;
        setTimeout(() => msg.classList.remove('show'), 4000);
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const gameData = { id: {{ game.id }} };
    fetch('/api/casino/get-balance')
        .then(r => r.json())
        .then(data => {
            gameData.balance = data.balance;
            window.rouletteGame = new RouletteGame(gameData);
        });
});
</script>
{% endblock %}
