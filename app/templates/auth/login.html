{% extends "base.html" %}
{% block title %}Sign in — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <h1>Sign in</h1>
  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="phone_number">Phone number</label>
      <input type="tel" id="phone_number" name="phone_number" placeholder="07XXXXXXXX" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn-gold auth-submit">Sign in</button>
  </form>
  <div class="auth-switch">New to Mzizibet? <a href="{{ url_for('auth.register', next=next) }}">Create an account</a></div>
</div>
{% endblock %}
