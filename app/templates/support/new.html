{% extends "base.html" %}
{% block title %}New Ticket — {{ site_name }}{% endblock %}
{% block content %}
<style>
  .support-form { max-width: 560px; margin: 30px auto; padding: 0 20px; }
  .support-form label { display: block; font-size: 0.85rem; color: var(--text-dim); margin: 16px 0 6px; }
  .support-form input, .support-form select, .support-form textarea {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text); font-family: var(--font-body);
  }
  .support-form textarea { min-height: 140px; }
</style>
<div class="support-form">
  <h1 style="font-family: var(--font-display);">New Support Ticket</h1>
  <form method="POST">
    <label>Category</label>
    <select name="category">
      <option value="general">General</option>
      <option value="payments">Payments</option>
      <option value="kyc">Identity Verification</option>
      <option value="technical">Technical Issue</option>
      <option value="account">Account</option>
    </select>

    <label>Subject</label>
    <input type="text" name="subject" required>

    <label>Message</label>
    <textarea name="body" required></textarea>

    <div style="margin-top: 20px;">
      <button type="submit" class="btn-gold">Submit ticket</button>
    </div>
  </form>
</div>
{% endblock %}
