{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ site_name }}{% endblock %}
{% block content %}
<div style="max-width: 760px; margin: 40px auto; padding: 0 20px;">
  <h1 style="font-family: var(--font-display); margin-bottom: 20px;">{{ page.title }}</h1>
  <div style="color: var(--text); line-height: 1.7;">
    {{ page.body_html|safe }}
  </div>
</div>
{% endblock %}
